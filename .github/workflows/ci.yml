# That HLS is correct is shown here, with no board and no application.
name: CI

on:
  pull_request:
    branches: [main]
  # a pull request's cache serves only itself: the CIRCT tools are cached from main
  push:
    branches: [main]

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"
  CIRCT_VERSION: "1.160.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix test

  # every kernel in simulation against its Elixir function
  circt:
    runs-on: ubuntu-24.04
    env:
      CIRCT_BIN: ${{ github.workspace }}/.circt/bin
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y iverilog libz3-4
      - uses: actions/cache@v4
        id: circt
        with:
          path: .circt/bin
          key: circt-${{ env.CIRCT_VERSION }}-ubuntu-24.04
      # the release is over 1 GB: only the two tools this project runs
      - if: steps.circt.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CIRCT_BIN"
          curl -fsSL "https://github.com/llvm/circt/releases/download/firtool-$CIRCT_VERSION/circt-full-static-linux-x64.tar.gz" |
            tar -xz -C "$CIRCT_BIN" --strip-components=2 --wildcards '*/bin/hlstool' '*/bin/mlir-opt'
      - run: EHLS_TEST_CIRCT=1 mix test --only circt

  # the circuits around the kernels, in Migen
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: pip install -r test/requirements.txt
      - run: python3 test/sim_cpu_ends.py
      - run: python3 test/sim_zip.py
      - run: python3 test/sim_events.py
      - run: python3 test/sim_ehls_gpio.py
